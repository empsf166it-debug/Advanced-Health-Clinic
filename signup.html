<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Mediora</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layouts.css">
    <link rel="stylesheet" href="css/animations.css">
    
    <style>
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-bottom: 0.5rem;
        }
        .social-btn:hover {
            background: var(--bg-secondary);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .divider:not(:empty)::before {
            margin-right: .25em;
        }
        .divider:not(:empty)::after {
            margin-left: .25em;
        }
        .password-input-wrap {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            background: none;
            border: none;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="auth-layout" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1920&q=80'); background-size: cover; background-position: center; position: relative;">
        <div style="position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.8);"></div>
        
        <div class="card auth-card reveal" style="position: relative; z-index: 10; max-width: 550px;">
            <div class="text-center mb-2">
                <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                    <i class="fa-solid fa-heart-pulse"></i>
                    Mediora
                </a>
                <h2 style="font-size: 1.5rem;">Create an Account</h2>
                <p style="font-size: 0.9rem;">Join us to manage your health easily</p>
            </div>
            
            <form action="#">
                <div class="grid grid-2" style="gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group" style="margin: 0;">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" placeholder="John" required>
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" placeholder="Doe" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="john@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" placeholder="+1 (555) 000-0000" required>
                </div>
                
                <div class="grid grid-2" style="gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group" style="margin: 0;">
                        <label class="form-label">Password</label>
                        <div class="password-input-wrap">
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label class="form-label">Confirm Password</label>
                        <div class="password-input-wrap">
                            <input type="password" class="form-control" id="confirm_password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm_password', this)">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; align-items: flex-start; gap: 0.5rem;">
                    <input type="checkbox" id="terms" style="width: 16px; height: 16px; margin-top: 3px;" required>
                    <label for="terms" style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer; line-height: 1.4;">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                
                <div class="divider">or continue with</div>
                
                <div class="grid grid-2" style="gap: 1rem;">
                    <button type="button" class="social-btn">
                        <i class="fa-brands fa-google text-primary"></i> Google
                    </button>
                    <button type="button" class="social-btn">
                        <i class="fa-brands fa-apple"></i> Apple
                    </button>
                </div>
                
                <div class="text-center mt-2" style="font-size: 0.9rem;">
                    Already have an account? <a href="login.html" style="font-weight: 600;">Sign in</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, btnElement) {
            const input = document.getElementById(inputId);
            const icon = btnElement.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
